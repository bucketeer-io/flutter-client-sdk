name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release_please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@f3969c04a4ec81d7a9aa4010d84ae6a7602f86a7 # v4.1.1
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }} # App token so the tag/release created by release-please can trigger other workflows

      # release-please builds the GitHub Release body from the release PR notes,
      # not from CHANGELOG.md, so the "Native SDK Changes" block added by the
      # augment-changelog workflow never reaches the published release. Re-sync
      # the release body from the (already augmented) CHANGELOG.md in the current ref.
      - name: Checkout
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync GitHub Release notes from CHANGELOG.md
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          node .github/scripts/changelog-section.mjs --tag "${TAG_NAME}" > release-notes.md
          gh release edit "${TAG_NAME}" --notes-file release-notes.md
